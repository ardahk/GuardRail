name: Browser reliability matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 2,5'

jobs:
  matrix-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: playwright-proxy/package-lock.json
      - run: npm ci --prefix playwright-proxy
      - name: Start fixtures and browser proxy
        run: |
          npm --prefix playwright-proxy run fixtures > /tmp/guardrail-fixtures.log 2>&1 &
          BROWSER_ENGINE=playwright PLAYWRIGHT_WIDGET_INIT_WAIT_MS=200 PLAYWRIGHT_STABILITY_THRESHOLD_MS=700 PLAYWRIGHT_NEW_MESSAGE_TIMEOUT_MS=8000 PLAYWRIGHT_MAX_RESPONSE_WAIT_MS=12000 npm --prefix playwright-proxy run start > /tmp/guardrail-proxy.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:7071/health && break
            sleep 1
          done
      - name: Run 20x12 acceptance soak
        run: npm --prefix playwright-proxy run test:matrix | tee /tmp/browser-matrix.json
      - name: Run browser fault matrix
        run: npm --prefix playwright-proxy run test:faults | tee /tmp/browser-faults.json
      - name: Upload redacted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-matrix-${{ github.run_id }}
          path: |
            /tmp/browser-matrix.json
            /tmp/browser-faults.json
            /tmp/guardrail-fixtures.log
            /tmp/guardrail-proxy.log
          retention-days: 14
